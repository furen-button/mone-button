name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check i18n
        run: npm run check:i18n

      # npm run lint は src/components/ToastLayer.tsx の既存 react-hooks/set-state-in-effect で初日から赤になるため、ここでは回さない。
      - name: Run tests
        run: npm test
